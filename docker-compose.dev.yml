# Local development: the app on 127.0.0.1:8000 with tracing to Jaeger, no tunnel.
# Its own project name and volume, so it never touches the production containers or cache.
name: gw2-wayfinder-dev

services:
  app:
    build:
      context: .
      target: dev
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      WAYFINDER_TRACING: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    volumes:
      - wayfinder-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - jaeger
    develop:
      watch:
        - action: sync+restart
          path: ./app
          target: /app/app
        - action: sync
          path: ./static
          target: /app/static
        - action: rebuild
          path: uv.lock

  # Trace viewer, see Tracing in the README.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "127.0.0.1:16686:16686"

volumes:
  wayfinder-data:
