[project]
name = "gw2-wayfinder"
version = "0.1.0"
description = "Guild Wars 2 AI assistant"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "pydantic-ai-slim[anthropic]>=2.67.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["app", "tests"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
