[project]
name = "gw2-wayfinder"
version = "0.1.0"
description = "Guild Wars 2 AI assistant"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "pydantic-ai-slim[anthropic]>=2.67.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
